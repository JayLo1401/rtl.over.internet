# nginx-Beispiel für rtl.over.internet auf rtl.jaycloud.at
# Ablage z. B. /etc/nginx/sites-available/rtl.jaycloud.at, Zertifikat per certbot:
#   certbot certonly --webroot -w /var/www/certbot -d rtl.jaycloud.at
#
# Nur HTTP(S) und der Steuerkanal laufen über nginx. Der Rendezvous-Endpunkt (UDP 3478/3479) geht
# NICHT über nginx, sondern direkt an den Container (network_mode: host).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name rtl.jaycloud.at;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rtl.jaycloud.at;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/rtl.jaycloud.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtl.jaycloud.at/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64k;

    # X-Forwarded-For wird überschrieben (nicht angehängt), damit Clients ihn nicht fälschen können.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Steuerkanal der rtltcp.server: WebSocket, dauerhaft offen
    location = /api/v1/control {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }
}
