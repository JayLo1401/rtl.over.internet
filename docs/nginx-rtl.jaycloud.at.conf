# nginx für rtl.over.internet auf rtl.jaycloud.at
#
# Ablage: /etc/nginx/sites-available/rtl.jaycloud.at, verlinkt nach sites-enabled.
# Zuerst nur HTTP; danach ergänzt certbot den TLS-Teil und die Umleitung selbst:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d rtl.jaycloud.at
#
# Nur Weboberfläche und Steuerkanal laufen über nginx. Der Rendezvous-Endpunkt (UDP 3478/3479) geht
# NICHT über nginx, sondern direkt an den Container (network_mode: host).

# WebSocket-Upgrade für den Steuerkanal (eigener Name, damit es keine Kollision mit anderen Seiten gibt)
map $http_upgrade $roi_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name rtl.jaycloud.at;
    server_tokens off;

    # Die App braucht nur kleine Anfragen (Formulare, Enrollment)
    client_max_body_size 64k;

    # Steuerkanal der rtltcp.server: WebSocket, dauerhaft offen
    location = /api/v1/control {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $roi_connection_upgrade;
        proxy_set_header Host              $host;
        # überschreiben, nicht anhängen: Clients können die Adresse so nicht fälschen
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Weboberfläche und Enrollment
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
