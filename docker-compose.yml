# Betrieb auf einem Server hinter nginx. Anleitung: docs/deployment.md
#
#   cp .env.example .env     # anpassen, mindestens ROI_PUBLIC_URL, ROI_ADMIN_PASSWORD, ROI_SECRET_KEY
#   docker compose up -d --build
#
# network_mode: host ist Absicht: Der Rendezvous-Endpunkt (UDP 3478/3479) muss die echte Absenderadresse
# sehen. Docker-Portmapping (vor allem IPv6 → IPv4 über docker-proxy) würde sie verfälschen.
# Die Weboberfläche bindet deshalb nur auf 127.0.0.1:8090 und ist nur über nginx erreichbar.
name: rtl-over-internet

services:
  rtl-over-internet:
    # Ohne ROI_IMAGE wird das Image aus diesem Repository gebaut. Mit eigener Registry z. B.
    # ROI_IMAGE=registry.example.com/rtl-over-internet:0.2.0 (dann: docker compose pull && docker compose up -d)
    image: ${ROI_IMAGE:-rtl-over-internet:latest}
    build: .
    container_name: rtl-over-internet
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Werte aus .env (Vorlage: .env.example), sonst die Standardwerte hier
    environment:
      ROI_PUBLIC_URL: ${ROI_PUBLIC_URL:?ROI_PUBLIC_URL setzen, z. B. https://mediator.example.com}
      ROI_ADMIN_USER: ${ROI_ADMIN_USER:-admin}
      ROI_ADMIN_PASSWORD: ${ROI_ADMIN_PASSWORD:-}
      ROI_SECRET_KEY: ${ROI_SECRET_KEY:-}
      ROI_TRUSTED_PROXIES: ${ROI_TRUSTED_PROXIES:-127.0.0.1/32,::1/128}
      ROI_HTTP_HOST: ${ROI_HTTP_HOST:-127.0.0.1}
      ROI_HTTP_PORT: ${ROI_HTTP_PORT:-8090}
      ROI_RENDEZVOUS_BIND: ${ROI_RENDEZVOUS_BIND:-::}
      ROI_RENDEZVOUS_PORTS: ${ROI_RENDEZVOUS_PORTS:-3478,3479}
      ROI_RENDEZVOUS_HOST: ${ROI_RENDEZVOUS_HOST:-}
      ROI_AUTH_MODES: ${ROI_AUTH_MODES:-all}
      ROI_OIDC_ISSUER: ${ROI_OIDC_ISSUER:-}
      ROI_OIDC_CLIENT_ID: ${ROI_OIDC_CLIENT_ID:-}
      ROI_OIDC_CLIENT_SECRET: ${ROI_OIDC_CLIENT_SECRET:-}
      ROI_OIDC_BUTTON_LABEL: ${ROI_OIDC_BUTTON_LABEL:-Mit SSO anmelden}
      ROI_OIDC_ADMIN_GROUPS: ${ROI_OIDC_ADMIN_GROUPS:-}
      ROI_OIDC_USER_GROUPS: ${ROI_OIDC_USER_GROUPS:-}
      ROI_COOKIE_SECURE: ${ROI_COOKIE_SECURE:-}
      ROI_TIMEZONE: ${ROI_TIMEZONE:-Europe/Vienna}
    volumes:
      # Host-Verzeichnis muss UID 10001 gehören (chown 10001:10001)
      - ${ROI_DATA_PATH:-./data}:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
