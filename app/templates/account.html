{% extends "base.html" %}
{% block title %}Konto · rtl.over.internet{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Konto <span class="muted mono">{{ user.username }}</span></h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if saved %}<p class="ok">Passwort geändert. Andere Sitzungen wurden abgemeldet.</p>{% endif %}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Bisheriges Passwort <input name="current" type="password" autocomplete="current-password" required maxlength="256"></label>
    <label>Neues Passwort (mind. 12 Zeichen) <input name="new" type="password" autocomplete="new-password" required minlength="12" maxlength="256"></label>
    <label>Neues Passwort wiederholen <input name="repeat" type="password" autocomplete="new-password" required minlength="12" maxlength="256"></label>
    <button type="submit">Passwort ändern</button>
  </form>
</section>
{% endblock %}
